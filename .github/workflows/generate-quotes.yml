name: Generate quote pool

on:
  push:
    branches: [main]
    paths:
      - "assets/data/quotes.xlsx"
      - "assets/data/generate_quotes.py"
      - ".github/workflows/generate-quotes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install spreadsheet reader
        run: pip install openpyxl
      - name: Generate JSON pool
        run: python assets/data/generate_quotes.py
      - name: Commit generated pool
        run: |
          if git diff --quiet -- assets/data/quotes.xlsx assets/data/quotes.json; then
            echo "Quote workbook and JSON are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/quotes.xlsx assets/data/quotes.json
          git commit -m "Update generated quote pool"
          git push
